    <script type="text/babel">
    /* ================================================================
       drewhyatt.us Account UI — Single-file React 18 SPA
       ================================================================ */

    const { useState, useEffect, useContext, createContext, useCallback, useMemo, useRef } = React;
    const { HashRouter, Routes, Route, Navigate, useNavigate, useLocation, Link } = ReactRouterDOM;

    // ─── API Layer ───────────────────────────────────────────────────
    const BASE_URL = 'https://drewhyatt.us';

    async function apiFetch(path, options = {}) {
        const url = `${BASE_URL}${path}`;
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        const res = await fetch(url, { ...options, headers });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            const err = new Error(data.message || data.error || `Request failed (${res.status})`);
            err.status = res.status;
            err.data = data;
            throw err;
        }
        return data;
    }

    function getStoredTokens() {
        return {
            accessToken: localStorage.getItem('dh_access_token'),
            refreshToken: localStorage.getItem('dh_refresh_token'),
        };
    }

    function storeTokens(access, refresh) {
        if (access) localStorage.setItem('dh_access_token', access);
        if (refresh) localStorage.setItem('dh_refresh_token', refresh);
    }

    function clearTokens() {
        localStorage.removeItem('dh_access_token');
        localStorage.removeItem('dh_refresh_token');
        localStorage.removeItem('dh_user');
    }

    const apiLogin = (email, password) =>
        apiFetch('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });

    const apiSignup = (email, username, password) =>
        apiFetch('/api/auth/signup', { method: 'POST', body: JSON.stringify({ email, username, password }) });

    const apiLogout = (token) =>
        apiFetch('/api/auth/logout', { method: 'POST', headers: { Authorization: `Bearer ${token}` } });

    const apiRefreshToken = (refreshToken) =>
        apiFetch('/api/auth/refresh', { method: 'POST', body: JSON.stringify({ refresh_token: refreshToken }) });

    const apiVerifyEmail = (token) =>
        apiFetch('/api/auth/verify-email', { method: 'POST', body: JSON.stringify({ token }) });

    const apiForgotPassword = (email) =>
        apiFetch('/api/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });

    const apiResetPassword = (token, password) =>
        apiFetch('/api/auth/reset-password', { method: 'POST', body: JSON.stringify({ token, password }) });

    const apiGetMe = (token) =>
        apiFetch('/api/auth/me', { method: 'GET', headers: { Authorization: `Bearer ${token}` } });

    const apiDeleteAccount = (token) =>
        apiFetch('/api/auth/account', { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });

    const apiResendVerification = (token) =>
        apiFetch('/api/auth/resend-verification', { method: 'POST', headers: { Authorization: `Bearer ${token}` } });

    const apiChangePassword = (token, currentPassword, newPassword) =>
        apiFetch('/api/auth/change-password', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: JSON.stringify({ current_password: currentPassword, new_password: newPassword }),
        });

    // Auto-refresh wrapper
    async function authedFetch(apiCall, token) {
        try {
            return await apiCall(token);
        } catch (err) {
            if (err.status === 401) {
                const { refreshToken } = getStoredTokens();
                if (refreshToken) {
                    try {
                        const refreshData = await apiRefreshToken(refreshToken);
                        storeTokens(refreshData.access_token, refreshData.refresh_token);
                        return await apiCall(refreshData.access_token);
                    } catch (e) {
                        clearTokens();
                        throw err;
                    }
                }
                clearTokens();
            }
            throw err;
        }
    }

    // ─── Hash query param hook ───────────────────────────────────────
    function useHashQuery() {
        const location = useLocation();
        return useMemo(() => {
            const hash = window.location.hash;

            if (qIndex === -1) return new URLSearchParams();
            return new URLSearchParams(hash.substring(qIndex));
        }, [location]);
    }

    // ─── Toast Context ──────────────────────────────────────────────
    const ToastContext = createContext();

    function ToastProvider({ children }) {
        const [toasts, setToasts] = useState([]);
        const toastIdRef = useRef(0);

        const addToast = useCallback((message, type = 'info') => {
            const id = ++toastIdRef.current;
            setToasts(prev => {
                const next = [...prev, { id, message, type, exiting: false }];
                return next.slice(-3);
            });
            setTimeout(() => {
                setToasts(prev => prev.map(t => t.id === id ? { ...t, exiting: true } : t));
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 250);
            }, 3000);
        }, []);

        return React.createElement(ToastContext.Provider, { value: { addToast } },
            children,
            React.createElement('div', { className: 'fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none', id: 'toast-container-a1b2' },

    }

    function useToast() { return useContext(ToastContext); }

    // ─── Auth Context ───────────────────────────────────────────────
    const AuthContext = createContext();

    function AuthProvider({ children }) {
        const [user, setUser] = useState(null);
        const [accessToken, setAccessToken] = useState(null);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            const { accessToken: storedToken, refreshToken: storedRefresh } = getStoredTokens();
            if (!storedToken) { setLoading(false); return; }

            (async () => {
                try {
                    const userData = await apiGetMe(storedToken);
                    setUser(userData.user || userData);
                    setAccessToken(storedToken);
                } catch (err) {
                    if (err.status === 401 && storedRefresh) {
                        try {
                            const refreshData = await apiRefreshToken(storedRefresh);
                            storeTokens(refreshData.access_token, refreshData.refresh_token);
                            const userData = await apiGetMe(refreshData.access_token);
                            setUser(userData.user || userData);
                            setAccessToken(refreshData.access_token);
                        } catch (e) { clearTokens(); }
                    } else { clearTokens(); }
                }
                setLoading(false);
            })();
        }, []);

        const login = useCallback(async (email, password) => {
            const data = await apiLogin(email, password);
            storeTokens(data.access_token, data.refresh_token);
            setAccessToken(data.access_token);
            setUser(data.user);
            return data;
        }, []);

        const signup = useCallback(async (email, username, password) => {
            return await apiSignup(email, username, password);
        }, []);

        const logout = useCallback(async () => {
            try { if (accessToken) await apiLogout(accessToken); } catch (e) {}
            clearTokens();
            setUser(null);
            setAccessToken(null);
        }, [accessToken]);

        const refreshTokenFn = useCallback(async () => {
            const { refreshToken } = getStoredTokens();
            if (!refreshToken) throw new Error('No refresh token');
            const data = await apiRefreshToken(refreshToken);
            storeTokens(data.access_token, data.refresh_token);
            setAccessToken(data.access_token);
            return data.access_token;
        }, []);

        const deleteAccount = useCallback(async () => {
            await apiDeleteAccount(accessToken);
            clearTokens();
            setUser(null);
            setAccessToken(null);
        }, [accessToken]);

        const updateUser = useCallback((userData) => {
            setUser(prev => ({ ...prev, ...userData }));
        }, []);

        const isAuthenticated = !!user && !!accessToken;

        const value = useMemo(() => ({
            user, accessToken, loading, isAuthenticated,
            login, signup, logout, refreshToken: refreshTokenFn, deleteAccount, updateUser,
        }), [user, accessToken, loading, isAuthenticated, login, signup, logout, refreshTokenFn, deleteAccount, updateUser]);

        return React.createElement(AuthContext.Provider, { value }, children);
    }

    function useAuth() { return useContext(AuthContext); }

    // ─── Shared Components ──────────────────────────────────────────

        const textSize = size === 'sm' ? 'text-base' : 'text-lg';

                className: `${s} rounded-lg flex items-center justify-center font-bold`,

            }, 'DH'),
            React.createElement('span', { className: `${textSize} font-semibold text-textPrimary` }, 'drewhyatt.us')
        );
    }

    function Alert({ type = 'error', message, onDismiss }) {
        if (!message) return null;

            error: 'bg-red-950/60 border-red-800/50 text-red-300',
            success: 'bg-emerald-950/60 border-emerald-800/50 text-emerald-300',
            warning: 'bg-amber-950/60 border-amber-800/50 text-amber-300',

            className: `flex items-start gap-3 p-3 rounded-lg border ${styles[type]} fade-in text-sm`,
            role: 'alert',
        },

                'aria-label': 'Dismiss',
                onClick: onDismiss,
            }, '✕')
        );
    }

            React.createElement('div', { className: 'relative' },

    function AuthCard({ children }) {
        return React.createElement('div', { className: 'auth-bg flex items-center justify-center min-h-screen px-4 py-8' },
            React.createElement('div', { className: 'w-full max-w-md p-6 md:p-8 bg-surface rounded-2xl card-shadow fade-in' }, children)

    }

    function PasswordStrength({ password }) {
        const score = useMemo(() => {
            let s = 0;
            if (!password) return 0;
            if (password.length >= 8) s += 2;
            if (password.length >= 12) s += 1;
            if (/[A-Z]/.test(password)) s += 1;
            if (/[a-z]/.test(password)) s += 1;
            if (/[0-9]/.test(password)) s += 1;
            if (/[^A-Za-z0-9]/.test(password)) s += 2;
            return s;
        }, [password]);

        if (!password) return null;

        let label, color, width;
        if (score <= 3) { label = 'Weak'; color = '#ff5b5b'; width = '30%'; }
        else if (score <= 6) { label = 'Fair'; color = '#f59e0b'; width = '65%'; }
        else { label = 'Strong'; color = '#00d4aa'; width = '100%'; }

        return React.createElement('div', { className: 'space-y-1 mt-1.5' },
            React.createElement('div', { className: 'h-1.5 bg-bg rounded-full overflow-hidden' },
                React.createElement('div', { className: 'h-full rounded-full strength-bar', style: { width, backgroundColor: color } })

            React.createElement('p', { className: 'text-xs', style: { color } }, label)
        );
    }

                            onClick: () => window.location.reload(),

            }

    }

    // ─── Protected Route ────────────────────────────────────────────
    function ProtectedRoute({ children }) {
        const { isAuthenticated, loading } = useAuth();

        if (!isAuthenticated) return React.createElement(Navigate, { to: '/login', replace: true });

    // ─── Login Page ─────────────────────────────────────────────────
    function LoginPage() {
        const { login, isAuthenticated } = useAuth();
        const navigate = useNavigate();
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [fieldErrors, setFieldErrors] = useState({});

        useEffect(() => { if (isAuthenticated) navigate('/account', { replace: true }); }, [isAuthenticated]);

        const validate = () => {
            const errs = {};
            if (!email.trim()) errs.email = 'Email is required';
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errs.email = 'Invalid email address';
            if (!password) errs.password = 'Password is required';

        const [password, setPassword] = useState('');
        const [confirmPassword, setConfirmPassword] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [success, setSuccess] = useState('');

    // ─── Danger Zone Tab ────────────────────────────────────────────
    function DangerTab() {
        const { user, deleteAccount } = useAuth();
        const navigate = useNavigate();
        const [showModal, setShowModal] = useState(false);
        const [confirmUsername, setConfirmUsername] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');

        const handleDelete = async () => {
            setError('');
            setLoading(true);
            try {
                await deleteAccount();
                navigate('/login');
            } catch (err) { setError(err.message || 'Failed to delete account'); }
            setLoading(false);
        };

        const usernameMatches = confirmUsername === (user?.username || '');

        return React.createElement(React.Fragment, null,
            React.createElement('div', { className: 'space-y-6' },
                React.createElement('div', { className: 'bg-surface rounded-xl p-5 md:p-6 border border-error/30', style: { boxShadow: '0 0 0 1px rgba(255,91,91,0.2), 0 8px 32px rgba(0,0,0,0.4)' } },
                    React.createElement('h2', { className: 'text-lg font-bold text-error mb-2' }, 'Danger Zone'),
                    React.createElement('h3', { className: 'text-sm font-semibold text-textPrimary mb-3' }, 'Delete Account'),
                    React.createElement('p', { className: 'text-sm text-textSecondary mb-4' }, 'Permanently delete your account and all associated data. This action cannot be undone.'),
                    React.createElement('ul', { className: 'text-sm text-textSecondary space-y-1.5 mb-6 list-disc list-inside' },
                        React.createElement('li', null, 'All account data will be permanently removed'),
                        React.createElement('li', null, 'All settings and preferences will be deleted'),
                        React.createElement('li', null, 'API access will be revoked immediately')
                    ),
                    React.createElement('button', {
                        className: 'px-5 py-2.5 border border-error text-error rounded-lg font-semibold hover:bg-error/10 transition-all cursor-pointer min-h-[44px]',
                        onClick: () => setShowModal(true),
                    }, 'Delete My Account')
                )
            ),

            // Modal
            showModal && React.createElement('div', {
                className: 'fixed inset-0 z-50 flex items-center justify-center px-4',
                role: 'dialog',
                'aria-modal': 'true',
                'aria-label': 'Confirm account deletion',
            },
                React.createElement('div', {
                    className: 'absolute inset-0 bg-black/70 backdrop-blur-sm',
                    onClick: () => { setShowModal(false); setConfirmUsername(''); setError(''); },
                }),
                React.createElement('div', { className: 'relative bg-surface rounded-2xl card-shadow p-6 max-w-md w-full fade-in space-y-5' },
                    React.createElement('div', { className: 'flex flex-col items-center text-center space-y-3' },
                        React.createElement('div', { className: 'w-14 h-14 rounded-full bg-error/20 flex items-center justify-center' },
                            React.createElement('span', { className: 'text-2xl text-error' }, '⚠')
                        ),
                        React.createElement('h3', { className: 'text-xl font-bold text-textPrimary' }, 'Are you absolutely sure?'),
                        React.createElement('p', { className: 'text-sm text-textSecondary' },
                            'This will permanently delete your account. Type ',
                            React.createElement('strong', { className: 'text-textPrimary' }, user?.username || 'your username'),
                            ' to confirm.'
                        )
                    ),
                    error && React.createElement(Alert, { type: 'error', message: error }),
                    React.createElement(InputField, {
                        label: 'Confirm username',
                        value: confirmUsername,
                        onChange: setConfirmUsername,
                        placeholder: user?.username || 'username',
                    }),
                    React.createElement('div', { className: 'flex gap-3' },
                        React.createElement('button', {
                            className: 'flex-1 py-2.5 rounded-lg font-semibold text-textSecondary border border-border hover:bg-surfaceRaised transition-all cursor-pointer min-h-[44px]',
                            onClick: () => { setShowModal(false); setConfirmUsername(''); setError(''); },
                        }, 'Cancel'),
                        React.createElement('button', {
                            className: `flex-1 py-2.5 rounded-lg font-semibold text-white transition-all min-h-[44px] flex items-center justify-center gap-2 ${
                                usernameMatches && !loading ? 'bg-error hover:bg-red-600 cursor-pointer' : 'bg-error/30 text-white/50 cursor-not-allowed'
                            }`,
                            disabled: !usernameMatches || loading,
                            onClick: handleDelete,
                        }, loading ? React.createElement(Spinner) : null, 'Permanently Delete')
                    )
                )
            )
        );
    }

    function RootRedirect() {

    // ─── App ────────────────────────────────────────────────────────
    function App() {
        return React.createElement(ErrorBoundary, null,

                React.createElement(Route, { path: '*', element: React.createElement(Navigate, { to: '/', replace: true }) })
