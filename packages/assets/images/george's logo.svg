<svg width="800" height="600" viewBox="0 0 800 600"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b3a6a" stroke-width="1"/>
    </pattern>

    <!-- Retro gradient -->
    <linearGradient id="retroGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4fa8"/>   <!-- bright pink -->
      <stop offset="50%" stop-color="#ff7b3a"/>  <!-- orange -->
      <stop offset="100%" stop-color="#ffd93b"/> <!-- yellow -->
    </linearGradient>

    <!-- Text outline filter (yellow + purple) -->
    <filter id="doubleOutline" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Outer purple glow -->
      <feMorphology in="SourceAlpha" result="thicken1" operator="dilate" radius="6"/>
      <feColorMatrix in="thicken1" result="purple"
                     type="matrix"
                     values="0 0 0 0 0.45
                             0 0 0 0 0.00
                             0 0 0 0 0.60
                             0 0 0 1 0"/>
      <!-- Inner yellow stroke -->
      <feMorphology in="SourceAlpha" result="thicken2" operator="dilate" radius="3"/>
      <feColorMatrix in="thicken2" result="yellow"
                     type="matrix"
                     values="0 0 0 0 1.00
                             0 0 0 0 0.85
                             0 0 0 0 0.10
                             0 0 0 1 0"/>
      <!-- Merge outlines and original -->
      <feMerge>
        <feMergeNode in="purple"/>
        <feMergeNode in="yellow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark blue background with subtle grid -->
  <rect width="100%" height="100%" fill="#061633"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.4"/>

  <!-- Centered logo group -->
  <g filter="url(#doubleOutline)"
     transform="translate(400, 300)">
    <!-- "George's" -->
    <text x="0" y="-20"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-weight="900"
          font-size="80"
          fill="url(#retroGradient)"
          letter-spacing="4">
      George's
    </text>

    <!-- "Games" -->
    <text x="0" y="70"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-weight="900"
          font-size="80"
          fill="url(#retroGradient)"
          letter-spacing="4">
      Games
    </text>
  </g>
</svg>
